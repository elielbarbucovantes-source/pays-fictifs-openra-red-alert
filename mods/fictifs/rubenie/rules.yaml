# =====================================================================
# RUBÉNIE — unités terrestres
# « Si ça tient, touche à rien. »
#
# Doctrine défensive : des unités plus solides et plus lentes que celles
# de l'Elielistan, un peu plus chères, qui gagnent les combats qui durent.
# La Rubénie construit la base soviétique ; sa caserne et son usine
# produisent ses propres unités (voir common/rules.yaml).
#
# Aviation : aviation.yaml. Marine : marine.yaml. Logistique : logistique.yaml.
# Tunnelier : tunnelier.yaml. QG et pouvoirs : defenses.yaml, pouvoirs.yaml.
# =====================================================================

^RubenieDoctrine:
	# Aura du Second Galactique : +15 % de dégâts, −15 % de dégâts reçus.
	ExternalCondition@GALACTIQUE:
		Condition: second-galactique
	FirepowerMultiplier@GALACTIQUE:
		RequiresCondition: second-galactique
		Modifier: 115
	DamageMultiplier@GALACTIQUE:
		RequiresCondition: second-galactique
		Modifier: 85
	WithDecoration@GALACTIQUE:
		Image: pips
		Sequence: pip-blue
		Position: TopLeft
		RequiresCondition: second-galactique

# ---------------------------------------------------------------------
# INFANTERIE (caserne soviétique)
