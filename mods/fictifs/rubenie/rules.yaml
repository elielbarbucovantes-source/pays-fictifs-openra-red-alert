		Prerequisites: ~infantry.rubenie, ~techlevel.infonly
		Description: Infanterie de base, solide mais lente.\nÀ son meilleur dans une tranchée ou un bunker.\n  Fort contre : infanterie\n  Faible contre : véhicules, aviation
	Selectable:
		Class: fusilier
	Valued:
		Cost: 120
	Tooltip:
		Name: Fusilier rubénien
	Health:
		HP: 6000
	Mobile:
		Speed: 50
	Armament@PRIMARY:
		Weapon: RubFusil
	Armament@GARRISONED:
		Weapon: RubFusil

