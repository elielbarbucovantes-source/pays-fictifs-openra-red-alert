		Description: Char rapide pour les contre-attaques :\nsortir, frapper, se replier. Canon de 90 mm à cadence rapide.\nBlindage léger pour un char.\n  Fort contre : véhicules, blindés\n  Faible contre : infanterie, aviation
	Selectable:
		Class: contreattaque
	Valued:
		Cost: 1000
	Tooltip:
		Name: Char de contre-attaque
	Health:
		HP: 34000
	Mobile:
		Speed: 128
	Turreted:
		TurnSpeed: 32
	Armament:
		Weapon: RubContreAttaque90mm

# Char lourd de forteresse : conçu pour tenir un point.
