ECLAIREUR:
	Inherits: E1
	Inherits@DOCTRINE: ^RubenieTerrestre
	RenderSprites:
		Image: spy
	Buildable:
		BuildPaletteOrder: 40
		Prerequisites: ~infantry.rubenie, dome, ~techlevel.low
		Description: Éclaireur camouflé. Très grande vision,\ndétecte les unités furtives et le Tunnelier sous terre.\nInvisible à l'arrêt ; ne tire que pour se défendre.\n  Faible contre : tout
	Selectable:
		Class: eclaireur
	Valued:
		Cost: 300
	Tooltip:
		Name: Éclaireur
	Health:
		HP: 3500
	Mobile:
		Speed: 64
	RevealsShroud:
		Range: 10c0
	DetectCloaked:
		Range: 7c0
	DetectCloaked@SISMIQUE:
		DetectionTypes: Seismic
		Range: 7c0
	Armament@PRIMARY:
		Weapon: RubPistolet
	# Le sprite d'espion n'a ni flammes de garnison ni pose de parachute.
	-Armament@GARRISONED:
	WithInfantryBody@PARACHUTE:
		StandSequences: stand
	AutoTarget:
		InitialStance: ReturnFire
		InitialStanceAI: ReturnFire
	Cloak:
		InitialDelay: 75
		CloakDelay: 75
		CloakSound: appear1.aud
		UncloakSound: appear1.aud
		IsPlayerPalette: true
		UncloakOn: Attack, Move, Load, Unload, Dock, Damage

# Second Galactique : à la fois officier (aura sur les unités rubéniennes
# proches) et combattant d'élite (Tesla, charges de démolition), chaque
# rôle étant moins fort que celui d'une unité spécialisée.
SECOND.GALACTIQUE:
	Inherits: SHOK
	Inherits@DOCTRINE: ^RubenieTerrestre
	RenderSprites:
		Image: shok
	Buildable:
		BuildPaletteOrder: 50
		BuildLimit: 1
		Prerequisites: ~infantry.rubenie, qg.rub, ~techlevel.high
		Description: Officier d'élite. 1 exemplaire maximum.\nAura (5 cases) : unités rubéniennes +15 % de dégâts,\n−15 % de dégâts reçus.\nDécharge Tesla, pose des charges de démolition.\n  Fort contre : infanterie, bâtiments\n  Faible contre : véhicules, aviation\n  Requiert : QG rubénien
	Selectable:
		Class: second.galactique
	Valued:
		Cost: 2000
	Tooltip:
		Name: Second Galactique
	Health:
		HP: 15000
	Mobile:
		Speed: 56
	RevealsShroud:
		Range: 7c0
	Armament@PRIMARY:
		Weapon: SecondGalactiqueTesla
	Armament@GARRISONED:
		Weapon: SecondGalactiqueTesla
	Demolition:
		DetonationDelay: 45
		Voice: Attack
	ProximityExternalCondition@GALACTIQUE:
		Condition: second-galactique
		Range: 5c0
	WithRangeCircle@GALACTIQUE:
		Type: second-galactique
		Range: 5c0
		Color: 4080FF80
		Visible: WhenSelected

# ---------------------------------------------------------------------
# CHARS (usine soviétique)
# ---------------------------------------------------------------------
# « Si ça tient, touche à rien » : char de bataille principal. Fiabilité
# avant mobilité : blindage élevé et réparation autonome hors combat.
SICATIENT:
	Inherits: 3TNK
	Inherits@DOCTRINE: ^RubenieTerrestre
	RenderSprites:
		Image: 3tnk
	Buildable:
		BuildPaletteOrder: 30
		Prerequisites: ~vehicles.rubenie, fix, ~techlevel.medium
		Description: Char de bataille principal. Canon de 115 mm, gros blindage.\nSe répare seul hors combat (jusqu'à 75 %).\n  Fort contre : blindés, véhicules\n  Faible contre : infanterie, aviation
	Selectable:
		Class: sicatient
	Valued:
		Cost: 1350
	Tooltip:
		Name: « Si ça tient, touche à rien »
	Health:
		HP: 70000
	Mobile:
		Speed: 56
	Armament:
		Weapon: Rub115mm
	ChangesHealth@FIABLE:
		Step: 300
		Delay: 25
		StartIfBelow: 75
		DamageCooldown: 200

# Char de contre-attaque : sortir, frapper, rentrer.
CONTREATTAQUE:
