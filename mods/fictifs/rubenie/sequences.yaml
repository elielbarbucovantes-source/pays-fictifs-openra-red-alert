# RUBÉNIE — sprites propres (tools/sprites.py) et sprites repris du mod ratc.

# QG rubénien : centre de communications de Red Alert.
qg.rub:
	Inherits: miss
	icon:
		Filename: fictifs|bits/qgicon.png

# Artillerie côtière : socle de la tourelle alliée, obusier tracté sur le dessus.
cotiere:
	Inherits: gun
	turret:
		Filename: fictifs|bits/howi.shp
		Start: 32
		Facings: 32
		UseClassicFacings: True
	recoil:
		Filename: fictifs|bits/howi.shp
		Start: 32
		Facings: 32
		UseClassicFacings: True
	damaged-turret:
		Filename: fictifs|bits/howi.shp
		Start: 32
		Facings: 32
		UseClassicFacings: True
	damaged-recoil:
		Filename: fictifs|bits/howi.shp
		Start: 32
		Facings: 32
		UseClassicFacings: True
	icon:
		Filename: fictifs|bits/howiticon.shp

# Char de contre-attaque (Leclerc du mod ratc).
leclerc:
