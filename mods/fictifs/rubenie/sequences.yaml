# Logistique, Tunnelier et pouvoirs du QG
# ---------------------------------------------------------------------
# Centre logistique (bâtiment « pionnier » du mod ratc).
centre.logistique:
	Defaults:
		Filename: fictifs|bits/pionier.png
	idle:
	damaged-idle:
		Start: 1
	make:
		Start: 2
		Length: 10
	bib:
		Filename: bib3.tem
		TilesetFilenames:
			SNOW: bib3.sno
			DESERT: bib3.des
		Length: *
	icon:
		Filename: fictifs|bits/pioniericon.png

# Opération Taupe : galerie creusée dans la terre (tools/sprites.py).
taupegate:
