# =====================================================================
# RUBÉNIE — logistique
#
#   Centre logistique / QG / chantier de construction / véhicule logistique
#   / Bastion roulant
#        ↓ (rayon de ravitaillement)
#   Unités terrestres ravitaillées : les plus fortes du jeu
#   (+10 % de dégâts, −10 % de dégâts reçus) et réparation lente.
#   Sans ravitaillement : un peu en dessous de la moyenne
#   (−10 % de dégâts, +10 % de dégâts reçus).
#   Le bonus dure encore 10 secondes après la sortie du rayon : le temps
#   de contre-attaquer juste au-delà de la ligne, puis de se replier.
#
# Le système est redondant : chaque source ravitaille seule, détruire un
# centre ne coupe pas toute la logistique.
# =====================================================================

# Unités terrestres rubéniennes : doctrine + logistique + Contre-attaque éclair.
^RubenieTerrestre:
	Inherits: ^RubenieDoctrine
	ExternalCondition@RAVITAILLE:
		Condition: ravitaille
	ExternalCondition@ATELIER:
		Condition: atelier
	GrantTimedConditionOnConditionEnd@RAVITAILLE:
		RequiresCondition: ravitaille
		Condition: ravitaille-reste
		Duration: 250
	FirepowerMultiplier@NORMAL:
		RequiresCondition: !ravitaille && !ravitaille-reste
		Modifier: 90
	DamageMultiplier@NORMAL:
		RequiresCondition: !ravitaille && !ravitaille-reste
		Modifier: 110
	FirepowerMultiplier@RAVITAILLE:
		RequiresCondition: ravitaille || ravitaille-reste
		Modifier: 110
	DamageMultiplier@RAVITAILLE:
		RequiresCondition: ravitaille || ravitaille-reste
		Modifier: 90
	WithDecoration@RAVITAILLE:
		Image: pips
		Sequence: pip-green
		Position: TopRight
		RequiresCondition: ravitaille || ravitaille-reste
	# Ravitaillée : réparation lente hors combat.
	ChangesHealth@RAVITAILLE:
		RequiresCondition: ravitaille
		Step: 100
		Delay: 50
		StartIfBelow: 100
		DamageCooldown: 250
	# Près d'un véhicule logistique : réparation rapide, même au combat.
	ChangesHealth@ATELIER:
		RequiresCondition: atelier
		Step: 250
		Delay: 25
		StartIfBelow: 100
	# Contre-attaque éclair (pouvoir du QG).
	ExternalCondition@ECLAIR:
		Condition: eclair
	SpeedMultiplier@ECLAIR:
		RequiresCondition: eclair
		Modifier: 140
	ReloadDelayMultiplier@ECLAIR:
		RequiresCondition: eclair
		Modifier: 75
	WithDecoration@ECLAIR:
		Image: pips
		Sequence: pip-yellow
		Position: BottomLeft
		RequiresCondition: eclair

# Source de ravitaillement : rayon autour du bâtiment ou du véhicule.
^SourceRavitaillement:
	ProximityExternalCondition@RAVITAILLE:
		Condition: ravitaille
		Range: 10c0
	WithRangeCircle@RAVITAILLE:
		Type: ravitaillement
		Range: 10c0
		Color: 40C04060
		Visible: WhenSelected

# Le chantier de construction ravitaille la base dès le début de partie
# (seules les unités rubéniennes y sont sensibles).
FACT:
	Inherits@RAVITAILLEMENT: ^SourceRavitaillement

# ---------------------------------------------------------------------
# Centre logistique : grande zone de ravitaillement. Plusieurs centres
# se relaient.
# ---------------------------------------------------------------------
CENTRE.LOGISTIQUE:
	Inherits: ^Building
	Inherits@IDISABLE: ^DisableOnLowPower
	Inherits@shape: ^2x2Shape
	Inherits@RAVITAILLEMENT: ^SourceRavitaillement
	RenderSprites:
		Image: centre.logistique
	Selectable:
		Bounds: 2048, 2048
	Buildable:
		Queue: Building
		BuildPaletteOrder: 65
		Prerequisites: proc, ~structures.rubenie, ~techlevel.low
		Description: Ravitaille les unités terrestres rubéniennes à 14 cases :\n+10 % de dégâts, −10 % de dégâts reçus, réparation lente\nhors combat (bonus gardé 10 s après la sortie du rayon).\nSans ravitaillement : −10 % de dégâts, +10 % de dégâts reçus.\nPlusieurs centres se relaient.
	Valued:
		Cost: 1000
	Tooltip:
		Name: Centre logistique
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	WithBuildingBib:
	Health:
		HP: 90000
	Armor:
		Type: Wood
	RevealsShroud:
		MinRange: 4c0
		Range: 6c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Power:
		Amount: -50
	ProvidesPrerequisite@buildingname:
	ProximityExternalCondition@RAVITAILLE:
		RequiresCondition: !disabled
		Range: 14c0
	WithRangeCircle@RAVITAILLE:
		Range: 14c0

# ---------------------------------------------------------------------
# Véhicule logistique : ravitaillement mobile, munitions et atelier de
# réparation de campagne pour les unités qui l'entourent.
# ---------------------------------------------------------------------
VEHICULE.LOGISTIQUE:
	Inherits: ^Vehicle
	Inherits@selection: ^SelectableSupportUnit
	Inherits@DOCTRINE: ^RubenieTerrestre
	Inherits@RAVITAILLEMENT: ^SourceRavitaillement
	RenderSprites:
		Image: truk
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 15
		Prerequisites: ~vehicles.rubenie, ~techlevel.low
		Description: Ravitaillement mobile (7 cases) : prolonge la logistique\nloin de la base.\nAtelier de campagne (3 cases) : répare vite les unités proches,\nmême au combat. Aucune arme.\n  Faible contre : tout
	Selectable:
		Class: vehicule.logistique
	Valued:
		Cost: 800
	Tooltip:
		Name: Véhicule logistique
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 20000
	Armor:
		Type: Light
	Mobile:
		Speed: 100
	RevealsShroud:
		Range: 5c0
	ProximityExternalCondition@RAVITAILLE:
		Range: 7c0
	WithRangeCircle@RAVITAILLE:
		Range: 7c0
	ProximityExternalCondition@ATELIER:
		Condition: atelier
		Range: 3c0

# ---------------------------------------------------------------------
# Détection sismique : révèle le Tunnelier sous terre.
# ---------------------------------------------------------------------
DOME:
	DetectCloaked@SISMIQUE:
		DetectionTypes: Seismic
		Range: 12c0
