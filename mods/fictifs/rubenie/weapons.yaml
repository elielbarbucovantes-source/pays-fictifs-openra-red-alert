# =====================================================================
# RUBÉNIE — armes
# Principe : l'inverse de l'Elielistan. Moins de dégâts par coup, mais
# des cadences soutenues et de la portée : la Rubénie gagne les combats
# qui durent, surtout depuis une position préparée.
# =====================================================================

# Fusilier rubénien : fusil standard, cadence un peu plus soutenue.
RubFusil:
	Inherits: M1Carbine
	ReloadDelay: 18

# Grenadier : grenades à zone d'effet élargie, idéales contre les groupes
# et dans les tranchées.
RubGrenade:
	Inherits: Grenade
	Range: 4c512
	Warhead@1Dam: SpreadDamage
		Spread: 384
		Damage: 5000

# Chasseur antichar : missile à longue portée, lent à recharger.
RubMissileAT:
	Inherits: Dragon
	Range: 6c512
	ReloadDelay: 60
	Projectile: Missile
		RangeLimit: 8c0
	Warhead@1Dam: SpreadDamage
		Damage: 5500

# Éclaireur : pistolet silencieux, pour se défendre seulement
# (le PPK de l'espion tue d'une balle : dégâts ramenés à un tir d'autodéfense).
RubPistolet:
	Inherits: SilencedPPK
	Range: 4c0
	ReloadDelay: 30
	Warhead@1Dam: SpreadDamage
		Damage: 800

# Second Galactique : décharge Tesla affaiblie (il est aussi officier).
SecondGalactiqueTesla:
	Inherits: PortaTesla
	ReloadDelay: 60
	Warhead@1Dam: SpreadDamage
		Damage: 3500

# « Si ça tient, touche à rien » : canon de 115 mm, salve de 2.
Rub115mm:
	Inherits: 105mm
	ReloadDelay: 65
	Range: 5c512

# Char de contre-attaque : canon de 90 mm à cadence rapide.
RubContreAttaque90mm:
	Inherits: 90mm
	ReloadDelay: 40

# Char lourd de forteresse : canon de 140 mm à longue portée.
RubForteresse140mm:
	Inherits: 120mm
	Range: 6c512
	ReloadDelay: 90
	Warhead@1Dam: SpreadDamage
		Damage: 7000

# Véhicule de reconnaissance : mitrailleuse légère.
RubRecoMG:
	Inherits: M60mg
	Range: 5c0

# Véhicule antiaérien : canons de 30 mm, plus de portée que le Flak.
RubFlakAA:
	Inherits: FLAK-23-AA
	Range: 7c0

RubFlakAG:
	Inherits: FLAK-23-AG

# Lance-missiles mobile : missile balistique à très longue portée.
RubMissileBalistique:
	Inherits: SCUD
	Range: 13c0
	ReloadDelay: 300
	Warhead@1Dam: SpreadDamage
		Damage: 6000

# Canon automoteur : obus de 152 mm, portée importante.
RubObus152:
	Inherits: 155mm
	Range: 11c0
	ReloadDelay: 100

# Artillerie lourde : portée et dégâts extrêmes, cadence très lente.
# Obus perforants : chaque obus retire 40 % des PV max d'une défense,
# quelle qu'elle soit (3 coups pour la détruire, même hors ravitaillement).
RubObusLourd:
	Inherits: 155mm
	Range: 18c0
	MinRange: 5c0
	ReloadDelay: 220
	Projectile: Bullet
		Inaccuracy: 512
	Warhead@1Dam: SpreadDamage
		Spread: 512
		Damage: 16000
		InvalidTargets: Defense
	Warhead@2AntiDef: HealthPercentageDamage
		Spread: 512
		Damage: 40
		ValidTargets: Defense

# Lance-roquettes multiple : Katioucha du mod WW3 (mêmes valeurs).
# Deux rampes de 3 roquettes, la seconde plus dispersée.
RubRoquettes:
	Inherits: 155mm
	ReloadDelay: 240
	Range: 8c768
	MinRange: 3c0
	Report: missile6.aud
	TargetActorCenter: false
	Burst: 3
	BurstDelays: 12
	ValidTargets: GroundActor, Trees, WaterActor
	Projectile: Bullet
		Inaccuracy: 1c512
		Image: dragon
		Speed: 200
		LaunchAngle: 70
		TrailImage: smokey
		Shadow: true
		Blockable: false
		ContrailLength: 0
	Warhead@1Dam: SpreadDamage
		Damage: 5000
		Spread: 512
		Falloff: 100, 37, 14, 5, 0
		Versus:
			None: 100
			Wood: 80
			Concrete: 65
			Light: 80
			Heavy: 45

RubRoquettesLarge:
	Inherits: RubRoquettes
	Projectile: Bullet
		Inaccuracy: 2c512

# Casemate antichar : gros canon fixe à longue portée.
RubCasemate:
	Inherits: TurretGun
	Range: 8c0
	ReloadDelay: 60
	Warhead@1Dam: SpreadDamage
		Damage: 12000

# Tourelle AA : canon antiaérien rapide.
RubTourelleAA:
	Inherits: ZSU-23
	Range: 8c0

# SAM rubénien : missile sol-air à longue portée.
RubSAM:
	Inherits: Nike
	Range: 11c0
	Projectile: Missile
		RangeLimit: 13c0

# Artillerie côtière : obus lourds (20000, +43 % depuis 14000).
RubCotiere:
	Inherits: 155mm
	Range: 14c0
	MinRange: 3c0
	ReloadDelay: 120
	# Engage navires et unités terrestres (pas les avions : obus balistique).
	ValidTargets: Ground, Water, GroundActor, WaterActor
	Projectile: Bullet
		# Tir de précision : dispersion 4 fois plus faible que le 155 mm de base (1c138).
		Inaccuracy: 0c256
	Warhead@1Dam: SpreadDamage
		Spread: 256
		Damage: 20000
		ValidTargets: GroundActor, WaterActor

# ---------------------------------------------------------------------
# Aviation
# ---------------------------------------------------------------------
# Chasseur polyvalent : missiles air-sol (aussi antinavires) et air-air.
RubChasseurAG:
	Inherits: Maverick
	Range: 8c0

RubChasseurAA:
	Inherits: HellfireAA
	Range: 6c0
	Projectile: Missile
		RangeLimit: 9c0
	Warhead@1Dam: SpreadDamage
		Damage: 4000

# Intercepteur : missiles air-air plus lourds et plus rapides à recharger.
RubIntercepteurAA:
	Inherits: HellfireAA
	Range: 7c0
	ReloadDelay: 20
	Projectile: Missile
		RangeLimit: 10c0
	Warhead@1Dam: SpreadDamage
		Damage: 5000

# Avion d'attaque : missiles antichars, salve de 2.
RubAttaqueMissile:
	Inherits: Maverick
	Range: 7c0
	Warhead@1Dam: SpreadDamage
		Damage: 9000

# ---------------------------------------------------------------------
# Marine
# ---------------------------------------------------------------------
# Escorteur : missiles antinavires légers, grenades anti-sous-marines,
# et surtout défense antiaérienne du groupe naval.
RubEscorteurSSM:
	Inherits: Stinger
	Range: 7c0

RubEscorteurAA:
	Inherits: StingerAA
	Range: 9c0
	Projectile: Missile
		RangeLimit: 11c0

# Frégate lance-missiles : missiles antinavires à très longue portée.
RubMissileAntiNavire:
	Inherits: Stinger
	Range: 13c0
	ReloadDelay: 150
	Burst: 2
	BurstDelays: 12
	ValidTargets: Water, WaterActor, Ground, GroundActor
	Projectile: Missile
		RangeLimit: 15c0
	Warhead@1Dam: SpreadDamage
		Damage: 9000

# Sous-marin : torpilles lourdes.
RubTorpille:
	Inherits: TorpTube
	Range: 8c0

# Porte-avions : défense antiaérienne rapprochée.
RubPorteAvionsAA:
	Inherits: StingerAA
	Range: 6c0

# ---------------------------------------------------------------------
# Pouvoirs du QG
# ---------------------------------------------------------------------
# Frappe de précision : énorme dégât sur une case, presque rien autour.
RubFrappePrecision:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Trees
	Warhead@1Dam: SpreadDamage
		Spread: 256
		Damage: 60000
		Falloff: 100, 20, 5, 0
		ValidTargets: GroundActor, WaterActor, Trees
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		ValidTargets: Ground
	Warhead@3Eff: CreateEffect
		Explosions: large_explosion
		ImpactSounds: kaboom25.aud

# ---------------------------------------------------------------------
# Bastion roulant (Battle Fortress rubénisée)
# ---------------------------------------------------------------------
# Canons de 130 mm antichars, un par tourelle.
RubBastion130mm:
	Inherits: 120mm
	Range: 6c0
	ReloadDelay: 70
	Burst: 1
	Warhead@1Dam: SpreadDamage
		Damage: 7500

# Lanceur de missiles arrière : aviation et infanterie.
RubBastionMissiles:
	Inherits: MammothTusk
	ValidTargets: AirborneActor, Infantry
	Burst: 4
	BurstDelays: 10
	Range: 8c0
	Projectile: Missile
		RangeLimit: 10c512
	Warhead@1Dam: SpreadDamage
		Damage: 4000
