# =====================================================================
# RUBÉNIE — intelligence artificielle
# Les listes de types (défenses, usines, avions, navires, protection)
# partagées sont dans common/ia.yaml ; ici, ce qui est propre à la Rubénie.
#
# Volontairement laissés aux joueurs humains :
#  - le Tunnelier (l'IA ne sait pas débarquer ses troupes) ;
#  - le porte-avions (l'IA ne sait pas y faire apponter ses avions) ;
#  - l'avion de reconnaissance (sans arme, inutile dans une escadrille) ;
#  - l'Opération Taupe (pouvoir à deux clics) ;
#  - tranchées vides et artillerie côtière (l'IA ne les garnit ni ne les place utilement).
# =====================================================================

