# =====================================================================
# RUBÉNIE — Tunnelier, unité signature
#
#   surface → s'enfonce en roulant → avance sous terre → émerge à l'arrêt
#   → débarque ses chasseurs antichars (déploiement, F)
#
# Il est sous terre dès qu'il roule : invisible et intouchable, sauf pour
# les détecteurs sismiques (Éclaireur, véhicule de reconnaissance,
# QG rubénien, dôme radar de n'importe quelle faction), à mi-vitesse.
# Quand il s'arrête, il émerge : 3 secondes immobile et +50 % de dégâts reçus.
# =====================================================================

TUNNELIER:
	Inherits: ^TrackedVehicle
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	Inherits@CARGOPIPS: ^CargoPips
	Inherits@DOCTRINE: ^RubenieTerrestre
	RenderSprites:
		Image: tunnelier
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 90
		BuildLimit: 2
		Prerequisites: ~vehicles.rubenie, qg.rub, stek, ~techlevel.high
		Description: Engin de sape. 2 exemplaires maximum.\nLivré avec 10 chasseurs antichars à bord.\nSe déplace sous terre (mi-vitesse) : invisible et intouchable,\nsauf pour les détecteurs sismiques.\nÉmerge à l'arrêt : 3 s immobile et vulnérable (+50 % de dégâts).\nDéploiement (F) : débarquer les troupes. Aucune arme.\n  Requiert : QG rubénien
	Selectable:
		Class: tunnelier
	Valued:
		Cost: 5000
	Tooltip:
		Name: Tunnelier
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 52000
	Armor:
		Type: Heavy
	Mobile:
		Speed: 90
		PauseOnCondition: notmobile || being-captured || emergence
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Cargo:
		Types: Infantry
		LoadingCondition: notmobile
		MaxWeight: 10
		InitialUnits: chasseur.at, chasseur.at, chasseur.at, chasseur.at, chasseur.at, chasseur.at, chasseur.at, chasseur.at, chasseur.at, chasseur.at
		EjectOnDeath: true
	WithCargoPipsDecoration:
		PipCount: 10
	# Sous terre dès qu'il roule.
	GrantConditionWhileMoving@SOUTERRAIN:
		Condition: souterrain
		LingerDelay: 20
	SpeedMultiplier@SOUTERRAIN:
		RequiresCondition: souterrain
		Modifier: 50
	Cloak@SOUTERRAIN:
		RequiresCondition: souterrain
		DetectionTypes: Seismic
		InitialDelay: 0
		CloakDelay: 0
		UncloakOn: Unload
		CloakSound: subshow1.aud
		UncloakSound: subshow1.aud
		IsPlayerPalette: true
	# Émergence : immobile et vulnérable 3 secondes.
	GrantTimedConditionOnConditionEnd@EMERGENCE:
		RequiresCondition: souterrain
		Condition: emergence
		Duration: 75
	DamageMultiplier@EMERGENCE:
		RequiresCondition: emergence
		Modifier: 150
	WithDecoration@EMERGENCE:
		Image: pips
		Sequence: pip-yellow
		Position: TopLeft
		RequiresCondition: emergence

# =====================================================================
# TUNNELIER AVANCÉ « Ferdinand de Lesseps » — Rubénie et Australouis, sans arme
#
#   touche de déploiement (F) → tracer une ligne (appuyer, glisser,
#   relâcher ; ou deux clics) → il creuse chaque case, une par une
#
# Une case creusée est une tranchée sèche (terrain accidenté). Dès que la
# tranchée touche la mer, toutes les cases reliées sont englouties d'un coup
# et deviennent un canal navigable. Les unités terrestres dedans se noient.
# On ne creuse ni sous un bâtiment, ni sous un arbre, ni sur un pont.
# Pas de doctrine logistique : l'unité est partagée avec l'Australouis.
# =====================================================================

World:
	CanalLayer:
		DrownDamageTypes: DefaultDeath

WEAP:
	ProvidesPrerequisite@canaux:
		Factions: rubenie, australouis
		Prerequisite: vehicles.canaux

TUNNELIER.AVANCE:
	Inherits: ^TrackedVehicle
	RenderSprites:
		Image: tunnelier.avance
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 95
		BuildLimit: 2
		Prerequisites: ~vehicles.canaux, fix, ~techlevel.medium
		Description: Trancheuse de génie, sans arme. 2 exemplaires maximum.\nDéploiement (F) puis tracer une ligne (glisser, ou deux clics) :\ncreuse chaque case de la ligne, environ 8 s par case.\nUne tranchée reliée à la mer est engloutie : elle devient un canal\nnavigable, et les unités terrestres qui s'y trouvent se noient.\nImpossible sous un bâtiment, un arbre ou un pont.\n  Requiert : centre de réparation
	Valued:
		Cost: 1200
	Tooltip:
		Name: Ferdinand de Lesseps
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 40000
	Armor:
		Type: Heavy
	Mobile:
		Speed: 60
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	DigsCanals:
		DigDelay: 200
		MaxLength: 24
		FloodedTextNotification: La mer envahit le canal !
