# =====================================================================
# RUBÉNIE — Bastion roulant
# La Battle Fortress, à la rubénienne : une position fortifiée qui se
# déplace. Elle ne tire que si des fantassins l'occupent, emporte son
# propre ravitaillement (toujours ravitaillé, ravitaille les unités autour)
# et se répare seule. Lente, mais « si ça tient, touche à rien ».
# =====================================================================

BASTION:
	Inherits: ^TrackedVehicle
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Inherits@CARGOPIPS: ^CargoPips
	Inherits@DOCTRINE: ^RubenieTerrestre
	Inherits@RAVITAILLEMENT: ^SourceRavitaillement
	RenderSprites:
		Image: bastion
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 65
		BuildLimit: 3
		Prerequisites: ~vehicles.rubenie, fix, stek, ~techlevel.high
		Description: Forteresse roulante. 3 exemplaires maximum.\nDeux canons de 130 mm et un lanceur de missiles (aviation, infanterie),\nqui ne tirent que si des fantassins sont à bord (8 places).\nLivré avec 2 fusiliers, 1 grenadier et 1 chasseur antichar.\nRavitaille les unités proches (6 cases), toujours ravitaillé lui-même,\nse répare seul hors combat.\n  Fort contre : blindés, infanterie, aviation\n  Faible contre : artillerie ; inutile sans équipage
	Selectable:
		Class: bastion
		DecorationBounds: 1877, 1621, 0, -170
	Valued:
		Cost: 3000
	Tooltip:
		Name: Bastion roulant
	TooltipDescription:
		Description: Ne tire que si des fantassins sont à bord.
		ValidRelationships: Ally
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 100000
	Armor:
		Type: Heavy
	Mobile:
		Speed: 40
		PauseOnCondition: notmobile || being-captured
	RevealsShroud:
		MinRange: 4c0
		Range: 6c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Cargo:
		Types: Infantry
		MaxWeight: 8
		InitialUnits: fusilier, fusilier, grenadier, chasseur.at
		LoadedCondition: equipage
		LoadingCondition: notmobile
		EjectOnDeath: true
	WithCargoPipsDecoration:
		PipCount: 8
	Turreted@PRIMARY:
		Turret: primary
		Offset: 200,-300,0
		TurnSpeed: 12
	Turreted@SECONDARY:
		Turret: secondary
		Offset: 200,300,0
		TurnSpeed: 12
	Turreted@TERTIARY:
		Turret: tertiary
		Offset: -300,0,358
		TurnSpeed: 16
	Armament@PRIMARY:
		Name: primary
		Turret: primary
		Weapon: RubBastion130mm
		LocalOffset: 467,0,269
		MuzzleSequence: muzzle
		RequiresCondition: equipage
	Armament@SECONDARY:
		Name: secondary
		Turret: secondary
		Weapon: RubBastion130mm
		FireDelay: 8
		LocalOffset: 467,0,269
		MuzzleSequence: muzzle
		RequiresCondition: equipage
	Armament@TERTIARY:
		Name: tertiary
		Turret: tertiary
		Weapon: RubBastionMissiles
		LocalOffset: 105,0,452
		RequiresCondition: equipage
	AttackTurreted:
		Turrets: primary, secondary, tertiary
		Armaments: primary, secondary, tertiary
	WithMuzzleOverlay:
	WithSpriteTurret@PRIMARY:
		Turret: primary
	WithSpriteTurret@SECONDARY:
		Turret: secondary
	WithSpriteTurret@TERTIARY:
		Turret: tertiary
		Sequence: turret2
	# Emporte son ravitaillement : il en profite lui-même.
	ProximityExternalCondition@RAVITAILLE:
		Range: 6c0
		AffectsParent: true
	WithRangeCircle@RAVITAILLE:
		Range: 6c0
	ChangesHealth@AUTOREPARATION:
		Step: 300
		Delay: 25
		StartIfBelow: 60
		DamageCooldown: 200
