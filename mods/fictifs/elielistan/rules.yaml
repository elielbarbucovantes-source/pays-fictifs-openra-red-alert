^ElielistanDrone:
	Inherits: ^Helicopter
	# Cible des systèmes anti-drone (aviation australouisienne et rubénienne).
	Drone:
	-DestroysNearbyDrones:
	Inherits@DOCTRINE: ^ElielistanDoctrine
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	-EjectOnDeath:
	-SpawnActorOnDeath:
	Explodes@AIR:
		Weapon: UnitExplodeHeli
		EmptyWeapon: UnitExplodeHeli
		RequiresCondition: airborne
	Selectable:
		Bounds: 1024, 1024
		DecorationBounds: 1024, 1024
	RevealsShroud:
		Type: GroundPosition
	Aircraft:
		CruiseAltitude: 2048
		TurnSpeed: 16
		Speed: 180
	AttackAircraft:
		AttackType: Hover
		FacingTolerance: 512

# Avispa : drone suicide (FPV). Fonce sur un fantassin et le tue d'un coup,
# puis disparaît. Presque aucun blindage : la moindre défense antiaérienne l'abat.
AVISPA:
	Inherits: ^ElielistanDrone
	RenderSprites:
		Image: avispa
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Helicopter
		BuildPaletteOrder: 30
		Prerequisites: ~aircraft.elielistan, ~techlevel.medium
		Description: Drone suicide. Fonce sur un fantassin et le tue d'un seul coup.\nUsage unique : le drone est détruit dans l'attaque.\nN'attaque que l'infanterie. Très fragile.\n  Fort contre : infanterie\n  Faible contre : défense antiaérienne, aviation
	Valued:
		Cost: 300
	Tooltip:
		Name: Avispa
	Health:
		HP: 800
	Armor:
		Type: Light
	RevealsShroud:
		Range: 6c0
	Armament:
		Weapon: AvispaDive
	AttackAircraft:
		FacingTolerance: 128
		PersistentTargeting: false
		OpportunityFire: False
	AutoTarget:
		InitialStance: AttackAnything
		InitialStanceAI: AttackAnything
		ScanRadius: 6
	Aircraft:
		CruiseAltitude: 1280
		TurnSpeed: 24
		Speed: 220
	# Le drone devient le projectile : il disparaît de l'écran dès qu'il plonge,
	# mais n'est retiré qu'après l'impact (sinon la charge perd son guidage).
	GrantConditionOnAttack@PLONGEE:
		Condition: plongee
		RevokeDelay: 1000
	KillsSelf@PLONGEE:
		RequiresCondition: plongee
		Delay: 40
		RemoveInstead: true
	WithFacingSpriteBody:
		RequiresCondition: !plongee
	WithShadow:
		RequiresCondition: !plongee
	Targetable@AIRBORNE:
		RequiresCondition: airborne && !plongee

