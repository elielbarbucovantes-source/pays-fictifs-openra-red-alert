# =====================================================================
# ELIELISTAN — unités
# « Tu ne combats pas l'armée elielistanaise.
#   Tu combats l'endroit où elle était il y a dix secondes. »
#
# Doctrine commune (^ElielistanDoctrine) : après avoir tiré, une unité
# gagne +35 % de vitesse pendant 4 secondes pour décrocher avant la riposte.
# En contrepartie, les unités sont moins blindées que leurs équivalents.
# =====================================================================

^ElielistanDoctrine:
	GrantConditionOnAttack@DECROCHAGE:
		Condition: decrochage
		RevokeDelay: 100
	SpeedMultiplier@DECROCHAGE:
		RequiresCondition: decrochage
		Modifier: 135
	# Ordre prioritaire du président (pouvoir du palais).
	ExternalCondition@ORDRE:
		Condition: ordre-prioritaire
	SpeedMultiplier@ORDRE:
		RequiresCondition: ordre-prioritaire
		Modifier: 125
	FirepowerMultiplier@ORDRE:
		RequiresCondition: ordre-prioritaire
		Modifier: 125
	ReloadDelayMultiplier@ORDRE:
		RequiresCondition: ordre-prioritaire
		Modifier: 80
	WithDecoration@ORDRE:
		Image: pips
		Sequence: pip-green
		Position: TopLeft
		RequiresCondition: ordre-prioritaire

# Véhicules que le Cóndor peut emporter. Après le largage, le véhicule
# reste désorienté 4 secondes : il ne tire pas, roule à moitié vitesse
# et subit +50 % de dégâts.
^CondorCarryable:
	Carryable:
		CarriedCondition: carried
		LockedCondition: notmobile
	GrantTimedConditionOnConditionEnd@LARGAGE:
		RequiresCondition: carried
		Condition: largage
		Duration: 100
	DamageMultiplier@LARGAGE:
		RequiresCondition: largage
		Modifier: 150
	SpeedMultiplier@LARGAGE:
		RequiresCondition: largage
		Modifier: 50
	WithDecoration@LARGAGE:
		Image: pips
		Sequence: pip-yellow
		Position: TopRight
		RequiresCondition: largage

