# =====================================================================
# ELIELISTAN — armes
# Principe : frappes brutales et courtes. Beaucoup de dégâts par tir,
# mais des rechargements longs : l'Elielistan perd un combat qui dure.
# =====================================================================

# Fusil de l'infanterie Aguila : un peu plus de portée que le fusilier allié.
AguilaRifle:
	Inherits: M1Carbine
	Range: 5c512

# Cazador : roquette antichar d'embuscade, une salve violente puis un long rechargement.
CazadorRocket:
	Inherits: Dragon
	ReloadDelay: 70
	Range: 5c512
	Warhead@1Dam: SpreadDamage
		Damage: 6500

# Désignateur laser (Explorador). Aucun dégât : la cible
# illuminée subit +25 % de dégâts de toutes les armes pendant 1,5 s.
AguilaDesignator:
	ReloadDelay: 20
	Range: 7c0
	ValidTargets: Ground, Water, GroundActor, WaterActor
	Projectile: LaserZap
		Width: 32
		Duration: 20
		Color: FF303090
		TrackTarget: true
	Warhead@1Designate: GrantExternalCondition
		Range: 0c512
		Duration: 38
		Condition: laser-designated
		ValidTargets: GroundActor, WaterActor

# Gavilán : mitrailleuse de reconnaissance.
GavilanMG:
	Inherits: M60mg
	Range: 5c0

# Halcón : missile antichar filoguidé, portée d'embuscade.
HalconATGM:
	Inherits: APTusk
	ReloadDelay: 90
	Range: 7c512
	Projectile: Missile
		RangeLimit: 9c0
	Warhead@1Dam: SpreadDamage
		Damage: 9000

# Jaguar : canon de 90 mm à cadence rapide.
Jaguar90mm:
	Inherits: 90mm
	ReloadDelay: 45

# Carro Aguila : canon de 120 mm.
Aguila120mm:
	Inherits: 105mm
	Range: 5c512

# Trueno : obus de 155 mm à très longue portée. Il faut des yeux (Explorador,
# Gavilán, drones) pour exploiter cette portée.
TruenoShell:
	Inherits: 155mm
	Range: 14c0
	ReloadDelay: 110
	Burst: 3
	BurstDelays: 12

# Lanzador : mêmes obus que le César (salve de 3).
LanzadorObus:
	Inherits: SCUD
	ReloadDelay: 375
	Burst: 3
	BurstDelays: 10, 10

# Vigía : missiles antiaériens.
VigiaSAM:
	Inherits: HellfireAA
	Range: 8c0
	Projectile: Missile
		RangeLimit: 9c512

# Drone Pico : mitrailleuse légère.
PicoMG:
	Inherits: M60mg
	Range: 4c512

# Drone Garra : missiles antichar (2 tirs, puis retour à l'héliport).
GarraMissile:
	Inherits: HellfireAG
	Range: 6c0
	Burst: 1
	Warhead@1Dam: SpreadDamage
		Damage: 12000

# Frappe Aguila : bombes des Rayo, larguées sans parachute.
RayoBomb:
	Inherits: ParaBomb
	ReloadDelay: 5
	-Projectile:
	Projectile: GravityBomb
		Image: PARABOMB
		Velocity: 0, 0, -120
		Acceleration: 0, 0, -10
		Shadow: False
	# ParaBomb (30000) −20 %, puis +10 % : 26400.
	Warhead@1Dam: SpreadDamage
		Damage: 26400

# ---------------------------------------------------------------------
# Aguila Nuclear : canon de 125 mm alimenté par le réacteur.
# Plus puissant que le 105 mm des chars lourds, cadence un peu plus lente.
# ---------------------------------------------------------------------
AguilaNuclear125:
	Inherits: 120mm
	Range: 5c512
	ReloadDelay: 80
	Warhead@1Dam: SpreadDamage
		Damage: 7500

# Destruction du réacteur : petite détonation nucléaire. Achève ce qui est
# collé au char, abîme sérieusement ce qui est à moins de 2 cases,
# mais ne rase pas une base (bâtiments peu touchés).
AguilaReactorBlast:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Underwater, AirborneActor, Trees
	Warhead@1Dam: SpreadDamage
		Spread: 512
		Damage: 24000
		Falloff: 100, 60, 30, 12, 0
		ValidTargets: GroundActor, WaterActor, Underwater, AirborneActor, Trees
		Versus:
			Wood: 35
			Concrete: 20
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		ValidTargets: Ground, Infantry
		Size: 2
	Warhead@3Eff: CreateEffect
		Explosions: nuke
		ImpactSounds: kaboom1.aud
		ImpactActors: false
		ValidTargets: Ground, Water, Air
	Warhead@4Shake: ShakeScreen
		Duration: 10
		Intensity: 3
		Multiplier: 1,1

# Zone contaminée : 5 impulsions (une toutes les 2 secondes) après l'explosion.
# Blesse tout le monde, amis compris, dans un rayon d'environ 1,5 case.
AguilaRadiationPulse:
	ValidTargets: Ground, Water, GroundActor, WaterActor
	Warhead@1Dam: SpreadDamage
		Spread: 512
		Damage: 2000
		Falloff: 100, 50, 0
		ValidTargets: GroundActor, WaterActor
		Versus:
			Wood: 10
			Concrete: 5
			Heavy: 60
		DamageTypes: Prone50Percent, FireDeath
	Warhead@2Eff: CreateEffect
		Explosions: small_napalm
		ImpactActors: false
		ValidTargets: Ground, Water

# Harpía : missiles air-sol (reprend le Maverick du MiG).
HarpiaMissile:
	Inherits: Maverick

# ---------------------------------------------------------------------
# Marine
# ---------------------------------------------------------------------
# Centinela (escorteur) : missiles antiaériens de défense de groupe.
CentinelaAA:
	Inherits: StingerAA
	Range: 8c0
	ReloadDelay: 45

# Tormenta (frégate) : missiles antinavires à longue portée.
TormentaMissile:
	Inherits: Stinger
	Range: 11c0
	ReloadDelay: 90
	Projectile: Missile
		RangeLimit: 13c0
	Warhead@1Dam: SpreadDamage
		Damage: 4000
		Versus:
			Heavy: 125

# Tiburón (sous-marin) : torpilles lourdes contre les gros navires.
TiburonTorpedo:
	Inherits: TorpTube
	Warhead@1Dam: SpreadDamage
		Damage: 5000

# Porte-avions Aguila : défense antiaérienne rapprochée.
PortaAguilaAA:
	Inherits: StingerAA
	Range: 6c0

# Antenne de gouvernement provisoire : simple mitrailleuse d'autodéfense.
AntenaMG:
	Inherits: M60mg
	Range: 4c0

# ---------------------------------------------------------------------
# Nathan : désignation laser d'un bâtiment, l'avion arrive ~1,3 s plus
# tard (10 cases à la vitesse du Rayo) et le rase d'un coup.
# ---------------------------------------------------------------------
NathanAirstrike:
	ReloadDelay: 2250
	Range: 8c0
	ValidTargets: Structure
	Projectile: LaserZap
		Width: 48
		Duration: 30
		Color: FF303090
		TrackTarget: true
	Warhead@1Dam: TargetDamage
		Spread: 96
		Damage: 10000000
		Delay: 32
		ValidTargets: Structure
		DamageTypes: ExplosionDeath
	Warhead@2Eff: CreateEffect
		Explosions: large_explosion
		ImpactSounds: kaboom25.aud
		Delay: 32
		ValidTargets: Structure

# ---------------------------------------------------------------------
# Bombardiers (repris de la carte WW3)
# ---------------------------------------------------------------------
# Bombardier tactique : bombes incendiaires (dérivées des bombes du B-2, plus légères).
TactiqueFireBombs:
	ReloadDelay: 11
	Range: 3c0
	TargetActorCenter: true
	ValidTargets: GroundActor, WaterActor, Ground, Water
	Projectile: GravityBomb
		Image: dropbombs
		Velocity: 40, 0, -74
		Acceleration: 0, 0, 0
		Shadow: true
	Warhead@1Dam: SpreadDamage
		Spread: 1c512
		Damage: 4500
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 90
			Wood: 80
			Light: 60
			Heavy: 20
			Concrete: 30
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		ValidTargets: Ground, Infantry
	Warhead@3Eff: CreateEffect
		Explosions: small_napalm
		ImpactSounds: firebl3.aud
		ValidTargets: Ground, Water, GroundActor

# B-2 : 6 bombes incendiaires lourdes par passage (bombes du B-2 de la carte WW3).
# Bombes guidées : chacune file vers la position de la cible au moment du
# largage (léger éparpillement), au lieu de tomber à la verticale le long de
# la trajectoire de l'avion, ce qui les faisait presque toutes rater.
B2FireBombs:
	ReloadDelay: 50
	Burst: 6
	BurstDelays: 5
	Range: 3c0
	TargetActorCenter: true
	ValidTargets: GroundActor, WaterActor, Ground, Water
	Projectile: Bullet
		Image: dropbombs
		Speed: 170
		Blockable: false
		Inaccuracy: 0c384
		InaccuracyType: Absolute
		Shadow: true
	Warhead@1Dam: SpreadDamage
		Spread: 1c256
		Damage: 16000
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 100
			Wood: 100
			Light: 80
			Heavy: 60
			Concrete: 80
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@15Dam: SpreadDamage
		Spread: 1c0
		Damage: 3200
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 70
			Wood: 70
			Light: 50
			Heavy: 30
			Concrete: 60
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		ValidTargets: Ground, Infantry
	Warhead@3Eff: CreateEffect
		Explosions: small_napalm
		ImpactSounds: firebl3.aud
		ValidTargets: Ground, Water, GroundActor

# Kirov : bombe lourde (bombe du Kirov de la carte WW3).
KirovBomb:
	ReloadDelay: 35
	ValidTargets: Ground, Water, GroundActor, WaterActor
	InvalidTargets: Air
	Range: 1c5
	Projectile: GravityBomb
		Image: tbomb
		OpenSequence: open
		Velocity: 5, 0, -66
		Acceleration: 0, 0, 0
		Shadow: True
	Warhead@1Dam: SpreadDamage
		Spread: 511
		Damage: 4500
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		ValidTargets: GroundActor, WaterActor, Ground
		InvalidTargets: Air
		Versus:
			None: 90
			Wood: 75
			Tree: 75
			Light: 70
			Heavy: 40
			Concrete: 100
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		InvalidTargets: Vehicle, Structure, Wall, Husk, Trees
	Warhead@3Eff: CreateEffect
		Explosions: nuke3
		ImpactSounds: kaboom1.aud
		ValidTargets: Ground, Ship, Trees
	Warhead@4EffWater: CreateEffect
		Explosions: large_splash
		ImpactSounds: splashl1.aud, splashl2.aud
		ValidTargets: Water, Underwater
		InvalidTargets: Ship, Structure, Bridge

# Chute d'un Kirov abattu.
KirovCrash:
	Inherits: KirovBomb
	Warhead@1Dam: SpreadDamage
		Damage: 9000

# Avispa : plongée du drone suicide. Tue un fantassin d'un coup (même couché),
# presque rien contre les véhicules et les bâtiments.
AvispaDive:
	ReloadDelay: 50
	Range: 2c512
	ValidTargets: Infantry
	Projectile: Missile
		Image: avispa
		Sequences: idle
		Palette: player
		IsPlayerPalette: true
		Speed: 240
		Arm: 0
		Blockable: false
		Inaccuracy: 0
		HorizontalRateOfTurn: 120
		VerticalRateOfTurn: 120
		CloseEnough: 256
		RangeLimit: 7c0
		Shadow: true
	Warhead@1Dam: SpreadDamage
		Spread: 256
		Damage: 20000
		ValidTargets: GroundActor
		Versus:
			None: 100
			Wood: 5
			Light: 10
			Heavy: 5
			Concrete: 5
		DamageTypes: TriggerProne, ExplosionDeath
	Warhead@2Eff: CreateEffect
		Explosions: small_explosion
		ImpactSounds: kaboom12.aud
		ValidTargets: Ground, GroundActor

# ---------------------------------------------------------------------
# Krajina Ekspres (elielistan/trains.yaml) : grosse salve, recharge lente.
# ---------------------------------------------------------------------
KrajinaRoquettes:
	Inherits: Dragon
	Range: 7c0
	Burst: 8
	BurstDelays: 5
	ReloadDelay: 175
	Projectile: Missile
		RangeLimit: 8c512
	Warhead@1Dam: SpreadDamage
		Damage: 4500

KrajinaCanon:
	Inherits: 90mm
	Range: 5c0
	ReloadDelay: 30
	Warhead@1Dam: SpreadDamage
		Damage: 2000
