# Train nucléaire (elielistan/trains-transport.yaml) : explosion du réacteur.
# Plus violente que celle de l'Aguila Nuclear : 6 cases, alliés compris.
ExplosionReacteurTrain:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Underwater, AirborneActor, Trees
	Warhead@1Dam: SpreadDamage
		Spread: 1c0
		Damage: 32000
		Falloff: 100, 80, 60, 40, 25, 12, 0
		ValidTargets: GroundActor, WaterActor, Underwater, AirborneActor, Trees
		Versus:
			Wood: 45
			Concrete: 30
			Heavy: 90
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		ValidTargets: Ground, Infantry
		Size: 4
	Warhead@3Eff: CreateEffect
		Explosions: nuke
		ImpactSounds: kaboom1.aud
		ImpactActors: false
		ValidTargets: Ground, Water, Air
	Warhead@4Shake: ShakeScreen
		Duration: 20
		Intensity: 5
		Multiplier: 1,1
	Warhead@5Flash: FlashPaletteEffect
		Duration: 15
		FlashType: Nuke
