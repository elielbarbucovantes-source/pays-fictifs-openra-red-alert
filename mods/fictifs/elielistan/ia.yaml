# =====================================================================
# ELIELISTAN — intelligence artificielle
# Les listes de types (défenses, usines, avions, navires, protection)
# partagées sont dans common/ia.yaml ; ici, ce qui est propre à l'Elielistan.
#
# Volontairement laissés aux joueurs humains :
#  - le Cóndor, l'Aguila Carrier, le Pelícano et le porte-avions Aguila
#    (l'IA ne sait ni accrocher, ni charger, ni débarquer, ni apponter) ;
#  - l'antenne de gouvernement provisoire et les tranchées ;
#  - l'Aguila Bridge et l'Aguila Gate (pouvoirs à deux clics).
# =====================================================================

Player:
	BaseBuilderBotModule@rush:
		BuildingLimits:
			palacio: 1
		BuildingFractions:
			palacio: 1
	BaseBuilderBotModule@normal:
		BuildingLimits:
			palacio: 1
			aerodromo: 3
		BuildingFractions:
			palacio: 1
			aerodromo: 3
	BaseBuilderBotModule@turtle:
		BuildingLimits:
			palacio: 1
			aerodromo: 2
		BuildingFractions:
			palacio: 1
			aerodromo: 2
	BaseBuilderBotModule@naval:
		BuildingLimits:
			palacio: 1
			aerodromo: 8
		BuildingFractions:
			palacio: 1
			aerodromo: 15
	UnitBuilderBotModule@rush:
		UnitsToBuild:
			aguila: 65
			cazador: 30
			gavilan: 25
			halcon: 25
			jaguar: 50
			trueno: 15
			vigia: 20
			carro.aguila: 30
