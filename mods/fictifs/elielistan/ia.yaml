	# Pouvoirs du palais et de l'héliport que l'IA sait utiliser.
	SupportPowerBotModule:
		Decisions:
			elielistanorden:
				OrderName: ElielistanPriorityOrder
				MinimumAttractiveness: 8
				Consideration@1:
					Against: Ally
					Types: GroundActor
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 3c0
				Consideration@2:
					Against: Enemy
					Types: GroundActor, Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 7c0
			elielistanojo:
				OrderName: ElielistanOjo
				MinimumAttractiveness: 2000
				Consideration@1:
					Against: Enemy
					Types: GroundActor, Structure
					Attractiveness: 1
					TargetMetric: Value
					CheckRadius: 10c0
			elielistanstrike:
				OrderName: ElielistanAguilaStrike
				MinimumAttractiveness: 2000
