# =====================================================================
# AUSTRALOUIS — intelligence artificielle
# Les listes de types (défenses, usines, avions, navires, protection)
# partagées sont dans common/ia.yaml ; ici, ce qui est propre à
# l'Australouis. Sa base est la base alliée : l'IA de Red Alert lui fait
# déjà construire caserne, usine, héliport, chantier naval et les unités
# alliées et l'infanterie soviétique de la caserne.
#
# Doctrine de l'IA : le Cheaper en masse au sol, l'aviation australouisienne
# (Albatros, Warthog, Manta, drones Moustique) en force principale, et la
# marine (L-0U15, Porte-Drone, sous-marin ICBM) dès qu'il y a de l'eau.
# Les gros bâtiments sont retardés (BuildingDelays, en ticks : 25 par
# seconde), sinon l'IA les tire au hasard avant d'avoir une armée.
#
# Volontairement laissés aux joueurs humains :
#  - le Révolutionnaire et le Mothership (leur effet passe par la touche
#    de déploiement, que l'IA n'utilise pas) ;
#  - le Cormoran (sans arme, il faut l'envoyer écoper puis pulvériser) ;
#  - la Baleine (transport : l'IA ne sait pas faire d'héliportage) ;
#  - le Radar blink (de la reconnaissance pure).
# Engineered Tsunami : l'IA vise une base ennemie ; le pouvoir cherche
# lui-même la côte la plus proche (TsunamiPower.cs).
# =====================================================================

Player:
	BaseBuilderBotModule@rush:
		BuildingDelays:
			base.aeronavale: 4500
			chantier.avance: 9000
			centrale.enrichissement: 9000
		BuildingLimits:
			base.aeronavale: 2
			chantier.avance: 1
		BuildingFractions:
			base.aeronavale: 3
			chantier.avance: 1
			centrale.enrichissement: 1
	BaseBuilderBotModule@normal:
