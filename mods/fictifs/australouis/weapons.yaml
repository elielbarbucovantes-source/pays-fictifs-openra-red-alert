# =====================================================================
# AUSTRALOUIS — armes de l'aviation
# =====================================================================

# Albatros : missiles air-sol, aussi contre les navires.
AlbatrosAG:
	Inherits: Maverick
	Range: 8c0

# Albatros : missiles air-air.
AlbatrosAA:
	Inherits: HellfireAA
	Range: 6c0
	ValidTargets: AirborneActor
	Projectile: Missile
		RangeLimit: 9c0
	Warhead@1Dam: SpreadDamage
		Damage: 4000
		ValidTargets: AirborneActor

# Warthog : canon GAU-8 de 30 mm (repris de la carte WW3).
WarthogCanon:
	Inherits: ^HeavyMG
	ReloadDelay: 3
	ValidTargets: Vehicle, Ship
	InvalidTargets: Infantry, Structure, Wall
	Range: 5c0
	MinRange: 3c0
	Projectile: InstantHit
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Damage: 6000
		Versus:
			None: 100
			Wood: 50
			Light: 150
			Heavy: 140
			Concrete: 25

# Warthog : missiles antichars.
WarthogMissile:
	Inherits: Maverick
	InvalidTargets: Infantry
	Burst: 2
	BurstDelays: 6
	Projectile: Missile
		HorizontalRateOfTurn: 100

# Manta : un passage de bombes incendiaires, un peu moins lourdes que
# celles du B-2.
MantaBombs:
	Inherits: B2FireBombs
	Warhead@1Dam: SpreadDamage
		Damage: 7500

# Moustique : le drone plonge sur sa cible. 10 000 dégâts contre le
# blindage lourd : 3 drones détruisent un char léger (26 000 PV), pas 2.
MoustiqueDive:
	ReloadDelay: 50
	Range: 2c512
	ValidTargets: Vehicle, Ship
	Projectile: Missile
		Image: moustique
		Sequences: idle
		Palette: player
		IsPlayerPalette: true
		Speed: 240
		Arm: 0
		Blockable: false
		Inaccuracy: 0
		HorizontalRateOfTurn: 120
		VerticalRateOfTurn: 120
		CloseEnough: 256
		RangeLimit: 7c0
		Shadow: true
	Warhead@1Dam: SpreadDamage
		Spread: 256
		Damage: 10000
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 30
			Wood: 40
			Light: 110
			Heavy: 100
			Concrete: 20
		DamageTypes: ExplosionDeath
	Warhead@2Eff: CreateEffect
		Explosions: med_explosion
		ImpactSounds: kaboom12.aud
		ValidTargets: Ground, GroundActor, Water, WaterActor

# Cormoran : pulvérisation d'eau. Aucun dégât ; les ennemis oublient ce
# qu'ils avaient découvert dans un rayon de 6 cases.
CormoranBrume:
	ReloadDelay: 60
	Range: 2c0
	ValidTargets: Ground, Water
	TargetActorCenter: true
	Projectile: InstantHit
		Blockable: false
	Warhead@1Brume: Reshroud
		Range: 6c0
	Warhead@2Nuage: CreateEffect
		Explosions: idle
		Image: smoke_m
		ValidTargets: Ground, Water

# Cheaper : petit canon, cadence moyenne.
CheaperCanon:
	Inherits: 25mm
	Warhead@1Dam: SpreadDamage
		Damage: 1800

# L-0U15 : un seul petit canon (vise aussi les sous-marins repérés).
L0U15Canon:
	Inherits: 25mm
	Range: 5c512
	ValidTargets: Ground, Water, Underwater
	Warhead@1Dam: SpreadDamage
		Damage: 1600
		ValidTargets: GroundActor, WaterActor, Underwater

# Mothership : une mitrailleuse antiaérienne, pour la forme.
MothershipAA:
	Inherits: ZSU-23
	Warhead@1Dam: SpreadDamage
		Damage: 1500

# Sous-marin ICBM : missile V3 (carte WW3).
SousMarinV3:
	Inherits: ^AntiGroundMissile
	ReloadDelay: 260
	Range: 24c0
	MinRange: 6c0
	Report: missile1.aud
	-Projectile:
	Projectile: Bullet
		Speed: 150
		Blockable: false
		TrailImage: smokey
		TrailDelay: 5
		Inaccuracy: 313
		Image: v2
		Shadow: True
		LaunchAngle: 180
	Warhead@1Dam: SpreadDamage
		Spread: 511
		Damage: 4200
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		ValidTargets: GroundActor, WaterActor, Trees
		Versus:
			None: 90
			Wood: 75
			Light: 70
			Heavy: 40
			Concrete: 100
		DamageTypes: Prone50Percent, TriggerProne, SmallExplosionDeath, Incendiary
	Warhead@3Eff: CreateEffect
		Explosions: napalm
		ImpactSounds: firebl3.aud
	Warhead@4EffWater: CreateEffect
		Explosions: large_splash
		ImpactSounds: splash9.aud
		ValidTargets: Water, Underwater
