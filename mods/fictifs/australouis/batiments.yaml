# =====================================================================
# AUSTRALOUIS — bâtiments et pouvoirs de soutien
# Centrale d'enrichissement : +5 % de revenus du minerai tant qu'elle
# est debout, et pouvoir « Raffinerie boost » (avec un silo).
# Le chantier naval avancé et le Radar blink sont dans marine.yaml.
# =====================================================================

CENTRALE.ENRICHISSEMENT:
	Inherits: ^Building
	Inherits@IDISABLE: ^DisableOnLowPower
	Inherits@shape: ^3x2Shape
	RenderSprites:
		Image: centrale.enrichissement
	Selectable:
		Bounds: 3072, 2048
	HitShape:
		UseTargetableCellsOffsets: false
		TargetableOffsets: 0,0,0, 840,0,0, 840,-1024,0, 420,768,0, -840,0,0, -840,-1024,0, -840,1024,0
	Buildable:
		Queue: Building
		BuildPaletteOrder: 140
		BuildLimit: 1
		Prerequisites: atek, ~structures.australouis, ~techlevel.high
		Description: Centrale d'enrichissement. 1 au maximum.\nTant qu'elle est debout, le minerai livré aux raffineries\nrapporte 5 % de plus.\nPouvoir (avec un silo) : Raffinerie boost.
	Valued:
		Cost: 2500
	Tooltip:
		Name: Centrale d'enrichissement
	Building:
		Footprint: xxx xxx ===
		Dimensions: 3,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 90000
	Armor:
		Type: Wood
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	WithBuildingBib:
	Power:
		Amount: -150
	ProvidesPrerequisite@buildingname:
	SupportPowerChargeBar:
	# Raffinerie boost : +20 % de revenus du minerai pendant 40 secondes.
	GrantConditionToOwnedActorsPower@BOOST:
		OrderName: AustralouisRaffinerieBoost
		PauseOnCondition: disabled
		Prerequisites: silo
		IconImage: australouis-powers
		Icon: raffinerieboost
		ChargeInterval: 6000
		Name: Raffinerie boost
		Description: Pendant 40 secondes, tout le minerai livré à vos\nraffineries rapporte 20 % de plus.\nNécessite un silo.
		Condition: boost-raffinerie
		Duration: 1000
		EndChargeTextNotification: Raffinerie boost prêt.
		SupportPowerPaletteOrder: 10

# Raffineries : +5 % avec la centrale d'enrichissement, +20 % pendant le
# Raffinerie boost (les deux se cumulent).
PROC:
	GrantConditionOnPrerequisite@ENRICHISSEMENT:
		Prerequisites: centrale.enrichissement
		Condition: enrichissement
	ResourceValueMultiplier@ENRICHISSEMENT:
		Modifier: 105
		RequiresCondition: enrichissement
	ExternalCondition@BOOST:
		Condition: boost-raffinerie
	ResourceValueMultiplier@BOOST:
		Modifier: 120
		RequiresCondition: boost-raffinerie

# Le silo de Red Alert ne fournit pas de prérequis à son nom : il en faut
# un pour le Raffinerie boost.
SILO:
	ProvidesPrerequisite@buildingname:
