	Valued:
		Cost: 1500
	Tooltip:
		Name: Chantier ferroviaire
	Building:
		Footprint: xxxx xxxx ++++
	Health:
		HP: 120000
	Power:
		Amount: -40
	RailProduction:
		Produces: Train
	Exit@1:
		ExitCell: 1,2
		SpawnOffset: -512,1024,0
		Facing: 768
	Exit@2:
		ExitCell: 2,2
		SpawnOffset: 512,1024,0
		Facing: 768
	Exit@3:
		ExitCell: 0,2
		SpawnOffset: -1536,1024,0
		Facing: 768
	Exit@4:
		ExitCell: 3,2
		SpawnOffset: 1536,1024,0
		Facing: 768
	RailTrack:
		Cells: 0,2, 1,2, 2,2, 3,2
		Depot: true
		ConnectedCondition: reseau-relie
	ProvidesPrerequisite@bonus:
		Prerequisite: reseau.ferroviaire
		RequiresCondition: reseau-relie
	WithTextDecoration@RELIE:
