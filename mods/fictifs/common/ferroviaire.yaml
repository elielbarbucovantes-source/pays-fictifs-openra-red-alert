	Building:
		Footprint: +
		TerrainTypes: Clear, Road, Rough, Beach
	HitShape:
		UseTargetableCellsOffsets: false
	Health:
		HP: 40000
	Armor:
		Type: Concrete
	-Crushable:
	Targetable:
