		Terrain: Road

# ---------------------------------------------------------------------
# Bâtiments : chantier ferroviaire (4×3, voie au sud) et gare (4×3 :
# bâtiment au nord, voie au milieu, quai au sud).
# ---------------------------------------------------------------------
^BatimentFerroviaire:
	Inherits: ^Building
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			TopLeft: -2048, -1536
			BottomRight: 2048, 1536
	Selectable:
		Bounds: 4096, 3072
	Building:
		Dimensions: 4,3
		TerrainTypes: Clear, Road
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@rails:
		Prerequisite: reseau.rails
	GivesBuildableArea:
		AreaTypes: building, rail
	LineBuildNode@RAIL:
		Types: rail
	RevealsShroud:
		Range: 5c0
	Armor:
		Type: Wood

