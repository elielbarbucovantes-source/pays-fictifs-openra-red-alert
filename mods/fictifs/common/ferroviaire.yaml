# =====================================================================
# PAYS FICTIFS — réseau ferroviaire (tous les pays)
#
#   Chantier ferroviaire ══ voie ferrée ══ Gare
#
# - Voie ferrée : segments posés comme des murs, à partir d'une gare,
#   d'un chantier ou d'une voie déjà posée. Les unités la traversent
#   (sans s'y arrêter) ; on ne l'attaque que volontairement.
#   Solide, bon marché, réparable.
# - Chantier ferroviaire : produit la locomotive et les wagons (onglet
#   Trains, sous l'onglet naval ; raccourci O). Les wagons sortent
#   seuls : la locomotive vient les atteler.
# - Gare : chargement et déchargement rapides, dételage des wagons.
#   Hors gare, sur la voie : 4 fois plus lent, unités débarquées en désordre.
# - Les trains ne roulent que sur les voies (les leurs ou celles des autres)
#   et se bloquent entre eux : prévoir des évitements.
# - Bonus logistique : un chantier et une gare reliés par les voies du même
#   joueur = +10 % de vitesse de production des véhicules.
#
# Code : Traits/Railway (RailNetwork, RailCar, TrainCargo, RailProduction),
# Activities/RailMove.cs, Activities/TrainUnload.cs.
# =====================================================================

World:
	RailNetwork:

# Les trains ont leur propre file et leur onglet (sous l'onglet naval) :
# seul le chantier ferroviaire (Production de type Train) les produit.
Player:
	NormalModeProductionQueue@Train:
		Type: Train
		DisplayOrder: 6
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		ReadyTextNotification: Unit ready.
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		SpeedUp: True

^Building:
	MultiModeProductionQueue@Train:
		Type: Train
		DisplayOrder: 6
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		ReadyTextNotification: Unit ready.
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled

# Bonus logistique : 100 / 110 = 91 % du temps de production des véhicules.
^ExistsInWorld:
	ProductionTimeMultiplier@FERROVIAIRE:
		Multiplier: 91
		Prerequisites: reseau.ferroviaire
		Queue: Vehicle

# ---------------------------------------------------------------------
# Voie ferrée
# ---------------------------------------------------------------------
