# ---------------------------------------------------------------------
# Trains : locomotive diesel, wagon de transport lourd (véhicules),
# wagon de transport léger (infanterie). 4 wagons par locomotive.
# ---------------------------------------------------------------------
^Train:
	Inherits@1: ^ExistsInWorld
	Inherits@2: ^IronCurtainable
	Inherits@3: ^ClassicFacingSpriteActor
	Inherits@bounty: ^GlobalBounty
	Inherits@selection: ^SelectableSupportUnit
	Inherits@handicaps: ^PlayerHandicaps
	Huntable:
	OwnerLostAction:
		Action: Kill
	UpdatesPlayerStatistics:
	Selectable:
		Bounds: 1536, 1536
	Targetable:
		TargetTypes: GroundActor, Vehicle
	HiddenUnderFog:
	ActorLostNotification:
		TextNotification: Unit lost.
	GpsDot:
		String: Vehicle
	WithDamageOverlay:
	Guardable:
	Tooltip:
		GenericName: Train
	Voiced:
		VoiceSet: VehicleVoice
	Explodes:
		Weapon: UnitExplodeSmall
		EmptyWeapon: UnitExplodeSmall
	WithFacingSpriteBody:
	HitShape:
	RevealsShroud:
		Range: 5c0
	Armor:
		Type: Heavy
	MapEditorData:
		Categories: Vehicle

LOCOMOTIVE.DIESEL:
	Inherits: ^Train
	RenderSprites:
		Image: locomotive.diesel
	Buildable:
		Queue: Train
		BuildPaletteOrder: 300
		Prerequisites: chantier.ferroviaire, ~techlevel.low
		Description: Tire jusqu'à 4 wagons sur les voies ferrées, presque aussi vite qu'un avion.\nClic droit : rouler jusqu'à la voie. Clic droit sur un wagon : l'atteler\n(en gare : sur un wagon du train, le dételer). Déployer : tout décharger.\nBloquée par les autres trains.
	Valued:
		Cost: 800
	Tooltip:
		Name: Locomotive diesel
	Health:
		HP: 60000
	RailCar:
		Cells: 2
		Locomotive: true
		Speed: 190
		MaxWagons: 4
	RevealsShroud:
		Range: 6c0

^Wagon:
	Inherits: ^Train
	Inherits@pips: ^CargoPips
	Buildable:
		Queue: Train
		Prerequisites: chantier.ferroviaire, ~techlevel.low
	RailCar:
		PauseOnCondition: train-chargement
	Cargo:
		UnloadTerrainTypes: Aucun
		LoadingCondition: train-chargement
		EjectOnDeath: true
	TrainCargo:

WAGON.LOURD:
	Inherits: ^Wagon
	RenderSprites:
		Image: wagon.lourd
	Buildable:
		BuildPaletteOrder: 301
		Description: Transporte 3 véhicules (chars compris ; les chars lourds\ncomptent pour 3). À atteler à une locomotive.\nDéploiement : décharger (rapide en gare).
	Valued:
		Cost: 400
	Tooltip:
		Name: Wagon de transport lourd
	Health:
		HP: 40000
	Cargo:
		Types: Vehicle, Char
		MaxWeight: 3
	RailCar:
		Cells: 3

WAGON.LEGER:
	Inherits: ^Wagon
	RenderSprites:
		Image: wagon.leger
	Buildable:
		BuildPaletteOrder: 302
		Description: Transporte 10 fantassins. À atteler à une locomotive.\nDéploiement : décharger (rapide en gare).
	Valued:
		Cost: 300
	Tooltip:
		Name: Wagon de transport léger
	Health:
		HP: 30000
	Armor:
		Type: Light
	Cargo:
		Types: Infantry
		MaxWeight: 10
	RailCar:
		Cells: 2

# ---------------------------------------------------------------------
# Trains blindés des pays (rubenie/, elielistan/, ananthanie/trains.yaml) :
# une locomotive blindée armée qui roule seule, tire, transporte quelques
# fantassins et peut tirer quelques wagons ordinaires.
# ---------------------------------------------------------------------
^TrainBlinde:
	Inherits: ^Train
	Inherits@pips: ^CargoPips
	Inherits@auto: ^AutoTargetGround
	Inherits@xp: ^GainsExperience
	Buildable:
		Queue: Train
	Selectable:
		Priority: 3
	RailCar:
		Locomotive: true
		PauseOnCondition: train-chargement
	Cargo:
		Types: Infantry
		UnloadTerrainTypes: Aucun
		LoadingCondition: train-chargement
		EjectOnDeath: true
	TrainCargo:
	Turreted:
		TurnSpeed: 24
	AttackTurreted:
	WithSpriteTurret:
	Explodes:
		Weapon: UnitExplode
		EmptyWeapon: UnitExplode
	RevealsShroud:
		Range: 6c0

# Wagon armé d'un train blindé (créé avec sa locomotive, voir SpawnsConsist) :
# tourelle et tir automatique, pas dans la barre de construction.
^WagonArme:
	Inherits: ^Train
	Inherits@auto: ^AutoTargetGround
	Inherits@xp: ^GainsExperience
	Selectable:
		Priority: 3
	RailCar:
	Turreted:
		TurnSpeed: 24
	AttackTurreted:
	WithSpriteTurret:
	Explodes:
		Weapon: UnitExplode
		EmptyWeapon: UnitExplode
