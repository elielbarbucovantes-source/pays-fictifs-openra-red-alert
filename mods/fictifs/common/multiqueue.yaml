# =====================================================================
# Files de production : option de partie « Normale » / « Multi-file »
# (comme le multi-queue de Combined Arms, voir Traits/Player/MultiQueue.cs).
# - Normale : files RA classiques sur le joueur (une par type, chaque
#   usine en plus accélère la file).
# - Multi-file : chaque usine a sa propre file d'unités et produit en
#   parallèle. Les bâtiments et défenses gardent une file unique.
# Les deux jeux utilisent les mêmes types (Infantry, Vehicle, Aircraft,
# Ship) : rien à changer dans les Buildable des unités.
# =====================================================================

Player:
	ProductionModeOption:
	# Files RA d'origine rendues inertes (faction inexistante) plutôt que
	# supprimées : des cartes RA (Fort Lonestar) les modifient encore.
	ClassicProductionQueue@Infantry:
		Factions: aucune
	NormalModeProductionQueue@Infantry:
		Type: Infantry
		DisplayOrder: 2
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		ReadyTextNotification: Unit ready.
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		SpeedUp: True
	ClassicProductionQueue@Vehicle:
		Factions: aucune
	NormalModeProductionQueue@Vehicle:
		Type: Vehicle
		DisplayOrder: 3
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		ReadyTextNotification: Unit ready.
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		SpeedUp: True
		BuildTimeSpeedReduction: 100, 75, 60, 50
	ClassicProductionQueue@Aircraft:
		Factions: aucune
	NormalModeProductionQueue@Aircraft:
		Type: Aircraft
		DisplayOrder: 4
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		ReadyTextNotification: Unit ready.
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		SpeedUp: True
	ClassicProductionQueue@Ship:
		Factions: aucune
	NormalModeProductionQueue@Ship:
		Type: Ship
		DisplayOrder: 5
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		ReadyTextNotification: Unit ready.
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
		SpeedUp: True

# Sur tous les bâtiments : une file ne s'active que si le bâtiment a une
# Production du même type (casernes, usine, aérodromes, chantiers navals,
# et tout nouveau bâtiment producteur sans rien ajouter).
^Building:
	MultiModeProductionQueue@Infantry:
		Type: Infantry
		DisplayOrder: 2
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		ReadyTextNotification: Unit ready.
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Training
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	MultiModeProductionQueue@Vehicle:
		Type: Vehicle
		DisplayOrder: 3
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		ReadyTextNotification: Unit ready.
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	MultiModeProductionQueue@Aircraft:
		Type: Aircraft
		DisplayOrder: 4
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		ReadyTextNotification: Unit ready.
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	MultiModeProductionQueue@Ship:
		Type: Ship
		DisplayOrder: 5
		LowPowerModifier: 300
		ReadyAudio: UnitReady
		ReadyTextNotification: Unit ready.
		BlockedAudio: NoBuild
		BlockedTextNotification: Unable to build more.
		LimitedAudio: BuildingInProgress
		LimitedTextNotification: Unable to comply. Building in progress.
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled

# Barre bleue de production sur les usines : celle de RA se liait à une
# file inerte (file d'usine en mode Normal, file RA d'origine sur le
# joueur) et restait vide. ModeProductionBar prend la file active.
# Les bâtiments des pays héritent de ceux-ci (AFLD, SYRD…).
SPEN:
	-ProductionBar:
	ModeProductionBar:
		ProductionType: Ship
SYRD:
	-ProductionBar:
	ModeProductionBar:
		ProductionType: Ship
WEAP:
	-ProductionBar:
	ModeProductionBar:
		ProductionType: Vehicle
FACT:
	-ProductionBar@Building:
	ModeProductionBar@Building:
		ProductionType: Building
	-ProductionBar@Defense:
	ModeProductionBar@Defense:
		ProductionType: Defense
		Color: 8A8A8A
HPAD:
	-ProductionBar:
	ModeProductionBar:
		ProductionType: Aircraft
AFLD:
	-ProductionBar:
	ModeProductionBar:
		ProductionType: Aircraft
BARR:
	-ProductionBar:
	ModeProductionBar:
		ProductionType: Infantry
KENN:
	-ProductionBar:
	ModeProductionBar:
		ProductionType: Infantry
TENT:
	-ProductionBar:
	ModeProductionBar:
		ProductionType: Infantry
