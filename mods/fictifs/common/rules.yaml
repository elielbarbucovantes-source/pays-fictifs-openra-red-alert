# =====================================================================
# PAYS FICTIFS — règles communes
# Chaque pays a son dossier (elielistan/, rubenie/, ...). Ce fichier branche les pays
# sur la base de Red Alert : factions, bâtiments, unités de départ.
# =====================================================================

^BaseWorld:
	Faction@elielistan:
		Name: Elielistan
		InternalName: elielistan
		Side: Allies
		Description: Elielistan : frapper puis disparaître\nUnités rapides, reconnaissance, drones, hélicoptère Cóndor.\nPouvoirs : Ojo del Aguila, Aguila Gate, Aguila Bridge,\nFrappe Aguila, ordres prioritaires du président.
	Faction@rubenie:
		Name: Rubénie
		InternalName: rubenie
		Side: Soviet
		Description: Rubénie : si ça tient, touche à rien\nDéfense, contre-attaques, artillerie lourde.\nTranchées, bunkers garnis, casemates antichars.\nUnités solides et lentes, qui gagnent les combats qui durent.
	Faction@australouis:
		Name: Australouis
		InternalName: australouis
		Side: Allies
		Description: Australouis : le peuple des îles\nPuissance aérienne et navale.\nChasseur Albatros, Warthog, bombardier Manta,\ndrones kamikazes Moustique, hydravion Cormoran.
	Faction@ananthanie:
		Name: Ananthanie
		InternalName: ananthanie
		Side: Soviet
		Description: Ananthanie : « Je contrôle le champ de bataille. »\nSuperpuissance technologique : blindés modernes, drones\nexplosifs, missiles, aviation. Quantité et qualité.\nPréparer, puis gagner la bataille en 7 minutes.
	Faction@random:
		RandomFactionMembers: RandomAllies, RandomSoviet, elielistan, rubenie, australouis, ananthanie

