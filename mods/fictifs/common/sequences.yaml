		Length: 4
		Tick: 160
	damaged-idle:
		Start: 4
		Length: 4
		Tick: 160
	make:
		Start: 8
		Length: 8
		Tick: 60
	icon:
		Filename: fictifs|bits/raffinerie.petroleicon.png

# Zone industrielle (common/zones.yaml).
zone.industrielle:
