		Filename: fictifs|bits/lasermark.png

# Système pétrole (common/petrole.yaml).
pipeline:
	Defaults:
		Filename: fictifs|bits/pipeline.png
	idle:
		Length: 16
	damaged-idle:
		Start: 16
		Length: 16
	icon:
		Filename: fictifs|bits/pipelineicon.png

raffinerie.petrole:
	Defaults:
		Filename: fictifs|bits/raffinerie.petrole.png
