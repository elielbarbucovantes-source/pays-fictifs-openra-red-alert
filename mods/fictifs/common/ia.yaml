	# --- Production d'unités ----------------------------------------------
	# Les parts (UnitsToBuild) des unités de Red Alert sont ici ; chaque pays
	# ajoute les siennes dans <pays>/ia.yaml (les listes se fusionnent).
	# MaxAircraft : avions hors chasseurs ; les chasseurs (AirToAirUnits)
	# suivent le nombre d'avions ennemis (MaintainAirSuperiority).
	# MaximiseProductionCashRequirement 0 : toutes les files produisent à chaque
	# passage (CA n'en servait qu'une sous 10 000 $, trop lent avec l'économie RA).
	UnitBuilderBotModuleCA@rush:
		RequiresCondition: enable-rush-ai
		UnitQueues: Vehicle, Infantry, Aircraft, Ship
		IdleBaseUnitsMaximum: 150
		ProductionMinCashRequirement: 300
		MaximiseProductionCashRequirement: 0
		MaxAircraft: 6
