# =====================================================================
# PAYS FICTIFS — listes partagées de l'IA
# Ces clés sont des listes uniques : un fichier qui les redéfinit écrase
# les autres. Elles sont donc tenues ici, pour tous les pays à la fois :
# listes de Red Alert (engine/mods/ra/rules/ai.yaml) + ajouts des pays
# (Elielistan, Rubénie, Australouis, Ananthanie).
# Le reste de l'IA de chaque pays est dans <pays>/ia.yaml.
# =====================================================================

