# =====================================================================
# PAYS FICTIFS — intelligence artificielle commune
#
# L'IA reprend les modules de Combined Arms (C# dans
# OpenRA.Mods.Fictifs/Traits/BotModulesCA, portés de CA 1.08.2) à la place
# de ceux de Red Alert. Ce qu'ils apportent :
#  - attaques en escouades de VALEUR (pas en nombre d'unités), qui
#    grossissent au fil de la partie, et itinéraires de contournement ;
#  - escouades de harcèlement (unités rapides) qui visent récolteurs et
#    raffineries, cibles prioritaires (chantier, raffineries, technologie) ;
#  - escadrilles qui chassent les avions ennemis et gardent la supériorité
#    aérienne, cibles aériennes choisies (pas de suicide sur les SAM) ;
#  - plusieurs casernes et usines, une 2e base (VCM), défenses tournées vers
#    l'ennemi, récolteurs qui évitent l'ennemi, coupure d'énergie et
#    réparations automatiques, ingénieurs qui capturent les derricks.
#
# Les 4 IA gardent leurs noms et leurs types (rush, normal, turtle, naval),
# donc leur Elo (ClassementElo.cs). Les modules de Red Alert sont retirés
# ici ; restent de ra|rules/ai.yaml les bots, leurs conditions et les
# pouvoirs de soutien (SupportPowerBotModule).
#
# Les listes de types (clés uniques : un fichier qui les redéfinit écrase
# les autres) sont tenues ici, pour tous les pays à la fois. Le reste de
# l'IA de chaque pays (bâtiments et unités propres, pouvoirs) est dans
# <pays>/ia.yaml.
# Temps en ticks : 25 par seconde.
# =====================================================================

Player:
	-HarvesterBotModule:
	-BuildingRepairBotModule:
	-McvManagerBotModule:
	-BaseBuilderBotModule@rush:
	-BaseBuilderBotModule@normal:
	-BaseBuilderBotModule@turtle:
	-BaseBuilderBotModule@naval:
	-SquadManagerBotModule@rush:
	-SquadManagerBotModule@normal:
	-SquadManagerBotModule@turtle:
	-SquadManagerBotModule@naval:
	-UnitBuilderBotModule@rush:
	-UnitBuilderBotModule@normal:
	-UnitBuilderBotModule@turtle:
	-UnitBuilderBotModule@naval:

	# --- Économie et entretien -------------------------------------------
	HarvesterBotModuleCA:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai
		HarvesterTypes: harv
		RefineryTypes: proc
		HarvestersPerRefinery: 2
		MaxHarvesters: 10
	BuildingRepairBotModuleCA:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai
	PowerDownBotModuleCA:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai
	# Débarquements amphibies quand aucun ennemi n'est joignable par la terre (DebarquementBotModule.cs).
	DebarquementBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai
	McvManagerBotModuleCA:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai
		McvTypes: mcv
		ConstructionYardTypes: fact
		McvFactoryTypes: weap
		ScanForNewMcvInterval: 80
		MaxBaseRadius: 25
		MinimumConstructionYardCount: 2
	# Ingénieurs : derricks (revenu, et pétrole par pipeline) et bâtiments
	# neutres ou ennemis de valeur.
	CaptureManagerBotModule:
		RequiresCondition: enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai
		CapturingActorTypes: e6
		CapturableActorTypes: oilb, hosp, fcom, miss, bio, fact, proc, weap, barr, tent, dome, atek, stek
		CheckCaptureTargetsForVisibility: false
		MaximumCaptureTargetOptions: 15

