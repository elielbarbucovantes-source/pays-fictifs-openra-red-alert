		Class: karnthal
	Valued:
		Cost: 950
	Tooltip:
		Name: Karnthal
	Health:
		HP: 16000
	Armor:
		Type: Light
	Mobile:
		Speed: 48
	-Crushable:
	Armament@PRIMARY:
		Weapon: KarnMitrailleuse
	Armament@GARRISONED:
		Weapon: KarnMitrailleuse

