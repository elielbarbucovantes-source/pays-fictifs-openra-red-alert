# =====================================================================
# ANANTHANIE — unités terrestres
# « Prospérité, innovation, puissance, Fraternité. »
#
# Superpuissance technologique : beaucoup d'unités (quantité) bien
# équipées (qualité), plus rapides que la moyenne, drones et missiles
# partout. L'Ananthanie construit la base soviétique ; sa caserne et son
# usine produisent ses propres unités (voir common/rules.yaml).
#
# Bâtiments et défenses : batiments.yaml. Armes : weapons.yaml.
# =====================================================================

# Doctrine commune à toutes les unités terrestres. Blitz (déclenché par la
# jauge d'offensive « Blitz 7 », lot 3) : +30 % de vitesse, +25 % de cadence,
# +15 % de dégâts.
^AnanthanieTerrestre:
	ExternalCondition@BLITZ:
		Condition: blitz
	SpeedMultiplier@BLITZ:
		RequiresCondition: blitz
		Modifier: 130
	ReloadDelayMultiplier@BLITZ:
		RequiresCondition: blitz
		Modifier: 80
	FirepowerMultiplier@BLITZ:
		RequiresCondition: blitz
		Modifier: 115

# Faiblesse géographique : les montagnes. Les véhicules ananthaniens
# perdent 20 % de vitesse en terrain accidenté.
^AnanthanieVehicule:
	Inherits@DOCTRINE: ^AnanthanieTerrestre
	GrantConditionOnTerrain@MONTAGNE:
		Condition: terrain-accidente
		TerrainTypes: Rough
	SpeedMultiplier@MONTAGNE:
		RequiresCondition: terrain-accidente
		Modifier: 80

# ---------------------------------------------------------------------
# INFANTERIE (caserne soviétique)
# ---------------------------------------------------------------------
# Thal : le fusilier de masse. Pas cher, formé très vite.
THAL:
	Inherits: E1
	Inherits@DOCTRINE: ^AnanthanieTerrestre
	RenderSprites:
		Image: e1
	Buildable:
		BuildPaletteOrder: 10
		BuildDurationModifier: 40
		Prerequisites: ~infantry.ananthanie, ~techlevel.infonly
		Description: Fusilier ananthanien. Bon marché et formé très vite :\nl'armée ananthanienne compte sur le nombre.\n  Fort contre : infanterie\n  Faible contre : véhicules, aviation
	Selectable:
		Class: thal
	Valued:
		Cost: 125
	Tooltip:
		Name: Thal
	Health:
		HP: 5000
	Mobile:
		Speed: 60
	Armament@PRIMARY:
		Weapon: ThalFusil

# Khesh-Thal : missile polyvalent, blindés ET avions.
KHESH.THAL:
	Inherits: E3
	Inherits@DOCTRINE: ^AnanthanieTerrestre
	RenderSprites:
		Image: e3
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~infantry.ananthanie, ~techlevel.infonly
		Description: Fantassin lance-missiles polyvalent.\nUn missile antichar et un missile antiaérien.\n  Fort contre : véhicules, aviation\n  Faible contre : infanterie
	Selectable:
		Class: khesh.thal
	Valued:
		Cost: 450
	Tooltip:
		Name: Khesh-Thal
	Health:
		HP: 4500
	Mobile:
		Speed: 56
	Armament@PRIMARY:
		Weapon: KheshAA
	Armament@SECONDARY:
		Weapon: KheshAT
	Armament@GARRISONED:
		Weapon: KheshAT

# Nayrak : opérateur de drones. Lance un drone explosif FPV, puis en prépare
