NAYRAK:
	Inherits: E2
	Inherits@DOCTRINE: ^AnanthanieTerrestre
	RenderSprites:
		Image: e2
	Buildable:
		BuildPaletteOrder: 30
		Prerequisites: ~infantry.ananthanie, fabrique.drones, ~techlevel.low
		Description: Opérateur de drones. Lance un drone explosif FPV\nà 7 cases, puis en prépare un autre (7 s).\n  Fort contre : véhicules, blindés légers\n  Faible contre : infanterie au contact, aviation\n  Requiert : fabrique de drones
	Selectable:
		Class: nayrak
	Valued:
		Cost: 600
	Tooltip:
		Name: Nayrak
	Health:
		HP: 4500
	Mobile:
		Speed: 56
	Armament@PRIMARY:
		Weapon: NayrakFPV
		LocalOffset: 0,0,555
		FireDelay: 10
	Armament@GARRISONED:
		Weapon: NayrakFPV
		FireDelay: 10
	-Explodes:
	AutoTarget:
		ScanRadius: 7

# Lunkar : éclaireur-désignateur. Marque les véhicules et bâtiments ennemis
# (+25 % de dégâts reçus) et abat les fantassins au fusil de précision.
LUNKAR:
	Inherits: E1
	Inherits@DOCTRINE: ^AnanthanieTerrestre
	RenderSprites:
		Image: spy
	Buildable:
		BuildPaletteOrder: 40
		Prerequisites: ~infantry.ananthanie, institut, ~techlevel.medium
		Description: Éclaireur-désignateur, camouflé à l'arrêt.\nMarque véhicules, navires et bâtiments au laser :\n+25 % de dégâts de toute l'armée pendant 3 s.\nFusil de précision contre l'infanterie.\n  Fort contre : infanterie, appui des blindés\n  Faible contre : véhicules, aviation\n  Requiert : institut d'innovation
	Selectable:
		Class: lunkar
	Valued:
		Cost: 750
	Tooltip:
		Name: Lunkar
	Health:
		HP: 4000
	Mobile:
		Speed: 64
	RevealsShroud:
		Range: 9c0
	DetectCloaked:
		Range: 6c0
	Armament@PRIMARY:
		Weapon: LunkarDesignateur
	Armament@SECONDARY:
		Name: secondary
		Weapon: LunkarPrecision
	# Le sprite d'espion n'a ni flammes de garnison ni pose de parachute.
	-Armament@GARRISONED:
	WithInfantryBody@PARACHUTE:
		StandSequences: stand
	Cloak:
		InitialDelay: 75
		CloakDelay: 75
		CloakSound: appear1.aud
		UncloakSound: appear1.aud
		IsPlayerPalette: true
		UncloakOn: Attack, Move, Load, Unload, Dock, Damage

# Karnthal : soldat en exosquelette. Très résistant, ne se fait pas écraser.
KARNTHAL:
	Inherits: SHOK
	Inherits@DOCTRINE: ^AnanthanieTerrestre
	RenderSprites:
