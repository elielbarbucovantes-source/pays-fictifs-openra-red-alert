# ---------------------------------------------------------------------
# VÉHICULES (usine soviétique)
# ---------------------------------------------------------------------
# Ratha : véhicule de combat d'infanterie. Transporte 5 fantassins,
# canon automatique sol/air en tourelle.
RATHA:
	Inherits: APC
	Inherits@DOCTRINE: ^AnanthanieVehicule
	RenderSprites:
		Image: ratha
	Buildable:
		BuildPaletteOrder: 40
		Prerequisites: ~vehicles.ananthanie, ~techlevel.low
		Description: Véhicule de combat d'infanterie. Transporte 5 fantassins.\nCanon automatique de 30 mm contre le sol et les airs.\n  Fort contre : infanterie, véhicules légers, hélicoptères\n  Faible contre : blindés
	Selectable:
		Class: ratha
	Valued:
		Cost: 1000
	Tooltip:
		Name: Ratha
	Health:
		HP: 32000
	Mobile:
		Speed: 128
	-AttackFrontal:
	-Armament:
	Armament@AG:
		Weapon: RathaCanonAG
		LocalOffset: 373,0,51
		MuzzleSequence: muzzle
	Armament@AA:
		Weapon: RathaCanonAA
		LocalOffset: 373,0,51
		MuzzleSequence: muzzle
	Turreted:
		TurnSpeed: 40
		Offset: 39,0,222
	AttackTurreted:
	WithSpriteTurret:
	WithMuzzleOverlay:
	# Le canon tire aussi sur les hélicoptères et avions.
	AutoTargetPriority@DEFAULT:
		ValidTargets: Infantry, Vehicle, Ship, Underwater, AirborneActor, Defense, Mine
	AutoTargetPriority@ATTACKANYTHING:
		ValidTargets: Infantry, Vehicle, Ship, Underwater, AirborneActor, Structure, Defense, Mine

# Mukhar : lance-drones. Fabrique lui-même 4 munitions rôdeuses ; le lot
# suivant arrive 15 s après la destruction de la dernière.
MUKHAR:
	Inherits: ^TrackedVehicle
	Inherits@DOCTRINE: ^AnanthanieVehicule
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	RenderSprites:
		Image: mukhar
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 50
		Prerequisites: ~vehicles.ananthanie, fabrique.drones, ~techlevel.medium
		Description: Lance-drones. Fabrique gratuitement 4 munitions rôdeuses ;\nle lot suivant arrive 15 s après la destruction de la dernière.\nElles plongent d'elles-mêmes sur les véhicules à 6 cases ;\nclic droit sur un ennemi : une munition part à l'attaque.\n  Fort contre : véhicules, blindés\n  Faible contre : aviation, défense antiaérienne\n  Requiert : fabrique de drones
	Selectable:
		Class: mukhar
		DecorationBounds: 1194, 1194
	Valued:
		Cost: 1500
	Tooltip:
		Name: Mukhar
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 22000
	Armor:
		Type: Light
	Mobile:
		Speed: 100
	RevealsShroud:
		MinRange: 4c0
		Range: 7c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	DroneCarrier:
		Drone: rodeuse
		BatchSize: 4
		RegenDelay: 375
		EscortRadius: 1c512
		FollowRange: 3c0
		ReadyTextNotification: Mukhar : 4 munitions rôdeuses prêtes.
	WithDronePipsDecoration:
		Position: BottomLeft
		RequiresSelection: true

# Munition rôdeuse du Mukhar (gratuite, introuvable dans la barre de construction).
RODEUSE:
	Inherits: DRONE.ESSAIM
	RenderSprites:
		Image: rodeuse
	Tooltip:
		Name: Munition rôdeuse
	TooltipDescription:
		Description: Munition rôdeuse du Mukhar.\nPlonge sur un véhicule ou un navire.
	Health:
		HP: 700
	Armament:
		Weapon: RodeusePlongee
	Aircraft:
		Speed: 210
	# Contrairement aux drones du Porte-Drone, les munitions rôdeuses
	# attaquent d'elles-mêmes les véhicules qui passent à 6 cases.
	AutoTarget:
		InitialStance: AttackAnything
		ScanRadius: 6

