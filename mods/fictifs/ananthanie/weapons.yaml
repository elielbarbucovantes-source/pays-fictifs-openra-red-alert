	Inherits: 25mm
	ReloadDelay: 14
	Range: 5c0
	Warhead@1Dam: SpreadDamage
		Damage: 1800

RathaCanonAA:
	Inherits: FLAK-23-AA
	Range: 6c0

# Agnar : missile de croisière. Vole bas, très loin, très précis.
AgnarCroisiere:
	ReloadDelay: 325
	Range: 16c0
	MinRange: 3c0
	Report: missile1.aud
	ValidTargets: Ground, Water, GroundActor, WaterActor, Trees
	TargetActorCenter: true
	Projectile: Missile
		Image: MISSILE
		Speed: 230
		Arm: 4
		Blockable: false
		Inaccuracy: 128
		HorizontalRateOfTurn: 24
		VerticalRateOfTurn: 24
		RangeLimit: 20c0
		TrailImage: smokey
		Shadow: true
		AllowSnapping: true
	Warhead@1Dam: SpreadDamage
		Spread: 512
		Damage: 12000
		Falloff: 100, 50, 20, 0
		ValidTargets: GroundActor, WaterActor, Trees
		Versus:
			None: 80
			Wood: 100
			Tree: 75
			Light: 90
			Heavy: 60
			Concrete: 100
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		InvalidTargets: Vehicle, Structure, Wall, Husk, Trees
	Warhead@3Eff: CreateEffect
		Explosions: large_explosion
		ImpactSounds: kaboom15.aud
		ValidTargets: Ground, GroundActor, Trees
	Warhead@4EffWater: CreateEffect
		Explosions: large_splash
		ImpactSounds: splash9.aud
		ValidTargets: Water, Underwater
		InvalidTargets: Ship, Structure, Bridge

