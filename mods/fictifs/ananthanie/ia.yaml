# =====================================================================
# ANANTHANIE — intelligence artificielle
# Les listes de types (défenses, usines, avions, navires, protection)
# partagées sont dans common/ia.yaml ; ici, ce qui est propre à l'Ananthanie.
#
# Doctrine de l'IA : beaucoup d'unités (Thal, Lunkra), drones et missiles,
# aviation nombreuse ; Blitz 7 déclenché quand l'armée est au contact.
# Les défenses et les gros bâtiments sont retardés (BuildingDelays, en
# ticks : 25 par seconde). Le moteur ne donne la priorité à la caserne et à
# l'usine qu'au-delà de 5000 de minerai en stock ; sans ces délais, l'IA
# tirait au hasard le Haut Commandement ou le chantier naval avant toute
# caserne et n'avait pas d'armée au bout de 5 minutes. Sans caserne, le
# moteur ne réclame qu'une raffinerie : l'IA finissait aussi sans argent.
# (Le chenil est retardé pour toutes les IA, dans common/ia.yaml.)
#
# Volontairement laissés aux joueurs humains :
#  - le Nayrath et le Nayra-Ambar (sans arme, inutiles dans une escouade) ;
#  - le Rathambar (l'IA ne sait pas faire de débarquement) ;
#  - l'Œil d'Ambar (de la reconnaissance pure, sans intérêt pour l'IA).
# =====================================================================

